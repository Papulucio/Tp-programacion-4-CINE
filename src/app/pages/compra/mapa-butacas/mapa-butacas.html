@if (aviso()) {
  <p class="alerta">{{ aviso() }}</p>
}

<div class="pantalla">
  <div class="pantalla__linea"></div>
  <span class="pantalla__texto">Pantalla</span>
</div>

<div class="mapa">
  @for (fila of filas(); track fila.letra) {
    <div class="mapa__fila" [class.mapa__fila--vip]="fila.recargo > 0" [class.mapa__fila--adaptada]="fila.tipo === 'adaptada'">
      <span class="mapa__letra" [title]="tipo(fila.letra) === 'adaptada' ? 'Fila adaptada' : tipo(fila.letra) === 'vip' ? 'Fila VIP' : 'Fila estándar'">
        {{ fila.letra }}
      </span>

      <div class="mapa__butacas">
        @for (numero of columnas(fila); track numero) {
          <button
            type="button"
            class="butaca"
            [class.butaca--vip]="fila.recargo > 0"
            [class.butaca--adaptada]="fila.tipo === 'adaptada'"
            [class.butaca--ocupada]="estaBloqueada(fila.letra, numero)"
            [class.butaca--elegida]="estaSeleccionada(fila.letra, numero)"
            [class.butaca--aislada]="esBloqueDerecho(fila, numero)"
            [class.butaca--aislada-izq]="esBloqueIzquierdo(fila, numero)"
            [disabled]="estaBloqueada(fila.letra, numero)"
            (click)="alternar(fila, numero)"
            [attr.aria-label]="'Butaca ' + fila.letra + numero"
          >
            {{ numero }}
          </button>
        }
      </div>
    </div>
  }
</div>

<div class="leyenda">
  <span><i class="punto punto--libre"></i> Libre</span>
  <span><i class="punto punto--elegida"></i> Elegida ({{ totalSeleccionadas() }}/{{ maximo() }})</span>
  <span><i class="punto punto--ocupada"></i> Occupada</span>
  <span><i class="punto punto--vip"></i> VIP (+${{ precio('R') }})</span>
  <span><i class="punto punto--adaptada"></i> Adaptada</span>
  @if (totalSeleccionadas() > 0) {
    <button type="button" class="boton boton--fantasma" (click)="limpiar()">Quitar selección</button>
  }
</div>
